name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, unit tests, local lakehouse + reconciliation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest

  legacy-baseline:
    name: Rebuild the legacy SQL Server reports and compare with the committed baseline
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-Only-Passw0rd!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      MSSQL_SA_PASSWORD: Ci-Only-Passw0rd!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[legacy]"
      - name: Build ucleany_ops, run the rpt.* procedures, export the results
        run: ucleany legacy --host localhost --snapshots /tmp/legacy_snapshots
      - name: Committed baseline must match what SQL Server produced
        run: diff -r legacy/report_snapshots /tmp/legacy_snapshots

  semantic-model:
    name: Load the Power BI model with TOM and check modelling rules and report fields
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: >-
          dotnet run --project tools/model-check -c Release --
          powerbi/Ucleany.SemanticModel/definition
          --report powerbi/Ucleany.Report/definition

  bundle:
    name: Validate and deploy the Databricks bundle
    runs-on: ubuntu-latest
    needs: [test, legacy-baseline, semantic-model]
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when the workspace is not configured
        id: guard
        run: echo "enabled=${{ env.DATABRICKS_HOST != '' }}" >> "$GITHUB_OUTPUT"
      - uses: databricks/setup-cli@main
        if: steps.guard.outputs.enabled == 'true'
      - run: databricks bundle validate -t prod
        if: steps.guard.outputs.enabled == 'true'
      - run: databricks bundle deploy -t prod
        if: steps.guard.outputs.enabled == 'true' && github.ref == 'refs/heads/main'
