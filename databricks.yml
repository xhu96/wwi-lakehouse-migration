# Databricks Asset Bundle: everything the lakehouse needs, deployed from Git.
#   databricks bundle deploy -t dev
#   databricks bundle run ucleany_lakehouse_job -t dev
bundle:
  name: ucleany-lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds the landing volume and the bronze, silver and gold schemas.
    default: ucleany_dev
  governance_strict:
    description: "true fails the job when a group in governance/policy.yml does not exist; false skips its grants."
    default: "false"

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: ucleany_dev

  prod:
    mode: production
    variables:
      catalog: ucleany_prod
      governance_strict: "true"
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      user_name: ${workspace.current_user.userName}
