[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ucleany"
version = "0.1.0"
description = "Ucleany BI platform: SQL Server operational reporting migrated to a Databricks lakehouse."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fra" }]
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "pyarrow>=15",
    "pyyaml>=6",
]

[project.optional-dependencies]
legacy = ["pymssql>=2.3"]
dev = ["pyspark==4.0.1", "pytest>=8", "ruff>=0.6"]

[project.scripts]
ucleany = "ucleany.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ucleany*"]

[tool.setuptools.package-data]
"ucleany.sql" = ["*/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["src/pipelines"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["ucleany", "conftest"]
