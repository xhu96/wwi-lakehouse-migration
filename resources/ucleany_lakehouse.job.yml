resources:
  jobs:
    ucleany_lakehouse_job:
      name: ucleany-lakehouse
      description: Land the SQL Server CDC extract, refresh bronze/silver/gold, apply the access policy, reconcile with the legacy reports.
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: Europe/Rome
        pause_status: PAUSED
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              # Pinned so the generator reproduces the legacy baseline byte for byte.
              - numpy==2.1.3
              - pandas==2.2.3
              - pyyaml==6.0.2
      tasks:
        - task_key: setup_unity_catalog
          environment_key: default
          spark_python_task:
            python_file: ../src/jobs/setup_unity_catalog.py
            parameters: ["--catalog", "${var.catalog}"]

        - task_key: land_cdc_extract
          depends_on:
            - task_key: setup_unity_catalog
          environment_key: default
          spark_python_task:
            python_file: ../src/jobs/land_cdc_extract.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --src
              - ${workspace.file_path}/src
              - --snapshots
              - ${workspace.file_path}/legacy/report_snapshots

        - task_key: lakehouse_pipeline
          depends_on:
            - task_key: land_cdc_extract
          pipeline_task:
            pipeline_id: ${resources.pipelines.ucleany_lakehouse_pipeline.id}

        - task_key: apply_governance
          depends_on:
            - task_key: lakehouse_pipeline
          environment_key: default
          spark_python_task:
            python_file: ../src/jobs/apply_governance.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --src
              - ${workspace.file_path}/src
              - --policy
              - ${workspace.file_path}/governance/policy.yml
              - --strict
              - ${var.governance_strict}

        - task_key: reconcile_with_legacy
          depends_on:
            - task_key: apply_governance
          environment_key: default
          spark_python_task:
            python_file: ../src/jobs/reconcile_with_legacy.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --src
              - ${workspace.file_path}/src
              - --snapshots
              - ${workspace.file_path}/legacy/report_snapshots
